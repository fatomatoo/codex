spring.application.name=backend
server.port=8080

# Local database: `docker compose up -d postgres` in the repository root
spring.datasource.url=jdbc:postgresql://localhost:5432/backend
spring.datasource.username=backend
spring.datasource.password=backend
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Set to false (e.g. in tests) to skip the example registrations
app.seed-data=true
